<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Verification</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: 90%;
            max-width: 450px;
            background: white;
            padding: 35px 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.10);
        }

        .icon {
            font-size: 65px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .brand,
        .product,
        .code {
            margin: 12px 0;
            font-size: 17px;
        }

        .code {
            background: #f1f3f5;
            padding: 12px;
            border-radius: 10px;
            word-break: break-all;
        }

        .loading {
            color: #555;
        }

        .authentic {
            color: #16803c;
        }

        .invalid {
            color: #c62828;
        }
    </style>
</head>

<body>

<div class="card">

    <div id="icon" class="icon">🔎</div>

    <h1 id="title">Checking...</h1>

    <div id="message" class="loading">
        Please wait while we verify this product.
    </div>

    <div id="productInfo"></div>

</div>


<script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
        getFirestore,
        doc,
        getDoc
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    // Firebase configuration

    const firebaseConfig = {

        apiKey: "AIzaSyAdEFf_VVmmt3Aa8arRZjcgxDuAXpCacMk",

        authDomain: "brand-verification-2ac04.firebaseapp.com",

        projectId: "brand-verification-2ac04",

        storageBucket: "brand-verification-2ac04.firebasestorage.app",

        messagingSenderId: "256288166753",

        appId: "1:256288166753:web:5f5a6211b2824708b2ab20"

    };


    // Initialize Firebase

    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);


    // Get code from URL

    const params = new URLSearchParams(window.location.search);

    const code = params.get("code");


    const icon = document.getElementById("icon");

    const title = document.getElementById("title");

    const message = document.getElementById("message");

    const productInfo = document.getElementById("productInfo");


    async function verifyProduct() {

        if (!code) {

            icon.textContent = "❌";

            title.textContent = "Invalid Request";

            title.className = "invalid";

            message.textContent = "No verification code was provided.";

            return;

        }


        try {

            const productRef = doc(db, "products", code);

            const productSnap = await getDoc(productRef);


            if (productSnap.exists()) {

                const product = productSnap.data();


                icon.textContent = "✅";

                title.textContent = "Authentic Product";

                title.className = "authentic";

                message.textContent = "This product code is valid.";

                productInfo.innerHTML = `

                    <div class="brand">

                        <strong>Brand:</strong> ${product.brand || "N/A"}

                    </div>

                    <div class="product">

                        <strong>Product:</strong> ${product.productName || "N/A"}

                    </div>

                    <div class="code">

                        <strong>Code:</strong><br>

                        ${product.code || code}

                    </div>

                `;

            } else {

                icon.textContent = "❌";

                title.textContent = "Invalid Product";

                title.className = "invalid";

                message.textContent = "This verification code was not found.";

                productInfo.innerHTML = `

                    <div class="code">

                        <strong>Code:</strong><br>

                        ${code}

                    </div>

                `;

            }

        } catch (error) {

            console.error(error);

            icon.textContent = "⚠️";

            title.textContent = "Verification Error";

            title.className = "invalid";

            message.textContent = "Unable to verify the product at this time.";

        }

    }


    verifyProduct();

</script>

</body>
</html>
